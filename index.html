<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>اولین سایت من</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Tahoma, Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .card {
            width: min(90%, 600px);

            padding: 50px;

            text-align: center;

            background: white;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;

            color: #333;

            font-size: 40px;
        }

        p {
            color: #666;

            font-size: 20px;

            line-height: 2;
        }

        button {
            border: none;

            padding: 15px 30px;

            border-radius: 12px;

            background: #667eea;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>سلام 👋</h1>

        <p>
            این اولین صفحه وب من است
            که با GitHub Pages ساخته شده!
        </p>

        <button onclick="showMessage()">
            کلیک کن
        </button>

        <p id="message"></p>

    </div>


    <script>
        function showMessage() {

            document.getElementById("message").innerText =
                "🎉 سایت من با موفقیت اجرا شد!";
        }
    </script>

</body>
</html>
